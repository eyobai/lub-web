# Builds the user site on every push to main and uploads it to cPanel (leyubid.com) over FTPS.
#
# Set up once in GitHub → Settings → Secrets and variables → Actions:
#   Secrets:   FTP_SERVER   (e.g. ftp.leyubid.com)
#              FTP_USERNAME (an FTP account whose folder is public_html)
#              FTP_PASSWORD
#   Variables: VITE_API_BASE_URL (optional; defaults to https://api.leyubid.com)
#              FTP_SERVER_DIR    (optional; defaults to ./ — the FTP account's own folder)
name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of uploading over it.
concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Type check, lint, format, translations, tests and the production build: nothing is uploaded if any fails.
      - name: Check and build
        run: npm run check
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.leyubid.com' }}

      - name: Make sure the build points at the live API
        run: grep -q "${VITE_API_BASE_URL#https://}" dist/index.html
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.leyubid.com' }}

      - name: Upload to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          # Leave what this workflow does not manage alone (cgi-bin, .well-known, …).
          exclude: |
            **/.git*
            **/.git*/**
